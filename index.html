<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="player">
    <h2>🎵 My Music Player</h2>
    <div class="cover">
      <img id="cover" src="https://via.placeholder.com/200" alt="Album Cover">
    </div>
    <h3 id="title">Sample Song</h3>
    <p id="artist">Unknown Artist</p>

    <!-- IMPORTANT: put your actual mp3 file here -->
    <audio id="audio" src="song.mp3"></audio>

    <div class="controls">
      <button id="prev">⏮️</button>
      <button id="play">▶️</button>
      <button id="pause">⏸️</button>
      <button id="next">⏭️</button>
    </div>

    <input type="range" id="progress" value="0" step="1">
  </div>

  <script src="script.js"></script>
</body>
</html>
